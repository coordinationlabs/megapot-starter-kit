name: Feature request
description: Suggest a new feature, enhancement, or improvement to the starter kit.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: prereqs
    attributes:
      label: Prerequisites
      options:
        - label: I've searched [existing issues](../../issues?q=is%3Aissue) and this isn't a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point — "I'm trying to do X but Y gets in the way."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about or worked around.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "I'd like to open a PR"
        - "I could help but would need guidance"
        - "No, just suggesting"
    validations:
      required: false
