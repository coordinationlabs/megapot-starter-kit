name: Bug report
description: Something in the starter kit doesn't work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please confirm the prerequisites below — they save everyone time.

  - type: checkboxes
    id: prereqs
    attributes:
      label: Prerequisites
      options:
        - label: I've searched [existing issues](../../issues?q=is%3Aissue) and this isn't a duplicate.
          required: true
        - label: I've read the [README](../../blob/main/README.md) and [CUSTOMIZE.md](../../blob/main/docs/CUSTOMIZE.md).
          required: true
        - label: The bug reproduces on an unmodified clone of the starter (not just in my fork).
          required: true

  - type: input
    id: version
    attributes:
      label: Starter kit version
      description: Release tag or commit SHA you're running.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What's broken? Be specific.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Clone the repo and run `pnpm install`
        2. Set env vars per `.env.example`
        3. Run `pnpm dev`
        4. Connect wallet, click "Play"
        5. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include console errors, network requests, screenshots — whatever you have.
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: dropdown
    id: package-manager
    attributes:
      label: Package manager
      options:
        - pnpm
        - npm
        - yarn
        - bun
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (if applicable)
      placeholder: "Chrome 120 / Safari 17 / Firefox 121"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Wallet provider, network (mainnet/testnet), anything else relevant.
    validations:
      required: false
